<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equivest CMS | Content Management</title>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script defer src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (!window.CMS) {
        document.body.innerHTML += '<div style="color:red; padding: 20px; font-family: sans-serif;">Failed to load CMS. Please disable Brave Shields or adblockers for this admin panel.</div>';
      }
    });
  </script>
</body>
</html>
