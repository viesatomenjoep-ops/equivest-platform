backend:
  name: github
  repo: viesatomenjoep-ops/equivest-platform
  branch: main

local_backend: true

media_folder: "public/images/portfolio"
public_folder: "/images/portfolio"

i18n:
  structure: multiple_folders
  locales: [en, nl, de, es]
  default_locale: en

collections:
  - name: "portfolio"
    label: "Showjumpers"
    folder: "src/content/portfolio"
    i18n: true
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Main Image", name: "image", widget: "image" }
      - { label: "YouTube URL", name: "youtube_url", widget: "string", required: false }
      - { label: "HorseTelex URL", name: "horsetelex_url", widget: "string", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Premium Access Only", name: "premium", widget: "boolean", default: false }
      - { label: "Category", name: "category", widget: "select", options: ["Hunters", "Jumpers", "Pony's", "Equitation"], required: false }
      - label: "Specifications"
        name: "specs"
        widget: "object"
        fields:
          - { label: "Age", name: "age", widget: "number" }
          - { label: "Gender", name: "gender", widget: "string" }
          - { label: "Height", name: "height", widget: "string" }
          - { label: "Level", name: "level", widget: "string" }
      - label: "Horse Documents"
        name: "documents"
        widget: "object"
        required: false
        fields:
          - { label: "Vet Check (PDF/URL)", name: "vet_check", widget: "file", required: false }
          - { label: "X-Rays (Zip/Link)", name: "xrays", widget: "string", required: false }
          - { label: "Passport (PDF/Image)", name: "passport", widget: "file", required: false }
          - { label: "FEI Data / Lifescore (Link)", name: "fei_data", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
